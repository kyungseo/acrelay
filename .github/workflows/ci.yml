# FEAT-20260722-002 3-OS evidence lanes (AR-2: owner-reviewed 2026-07-22,
# conditional approve applied). No vendor CLIs, model dispatch, secrets, or
# application network calls. Standard GitHub Actions, Go toolchain, module,
# and cache fetches may occur. Runner identity is recorded per lane and never
# aggregated: windows-latest is Windows Server x64 evidence, not Windows 11
# evidence (the Windows 11 ARM64 lane is the owner-operated UTM manual
# runbook).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # macOS arm64
          - os: ubuntu-latest # Linux amd64
          - os: windows-latest # Windows Server x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Evidence manifest (N1 — exact lane identity, never aggregated)
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
          go version
          echo "goos=$(go env GOOS) goarch=$(go env GOARCH)"
          uname -a || true
          if command -v gcc >/dev/null 2>&1; then
            gcc --version | head -1
          else
            echo "gcc: not found"
          fi
      - name: Evidence manifest — workspace filesystem (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "workspace_fs:"
          df -T . 2>/dev/null || df .
      - name: Evidence manifest — workspace filesystem (Windows volume)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vol = Get-Volume -FilePath $env:GITHUB_WORKSPACE
          Write-Output ("workspace_volume={0} filesystem={1} fstype={2} health={3}" -f $vol.DriveLetter, $vol.FileSystem, $vol.FileSystemType, $vol.HealthStatus)
      - name: Race preflight (CGO toolchain required for -race)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gcc >/dev/null 2>&1; then
            echo "no C toolchain: -race lane cannot run"
            exit 1
          fi
      - name: Module metadata is tidy (R1-CX-F7)
        shell: bash
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go build ./...
      - name: Deterministic suite
        run: go test ./... -count=1
      - name: Race suite
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -count=1
